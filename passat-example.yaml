type: custom:universal-car-card
vehicle:
  make: Volkswagen
  model: Passat
  trim: eHybrid

# Neem de echte entity-ID's over uit je huidige werkende kaart.
entities:
  battery: sensor.vw_battery_level
  electric_range: sensor.vw_electric_range
  fuel_level: sensor.vw_fuel_level
  fuel_range: sensor.vw_fuel_range
  charging_connected: binary_sensor.evcc_carport_connected
  charging_status: sensor.vw_charging_status
  lock: lock.vw_passat

images:
  side: /local/universal-car-card/cars/passat/side.png
  rear: /local/universal-car-card/cars/passat/rear.png
  fallback: /local/universal-car-card/cars/passat/side.png

# Ook sensor.vw_images werkt voor side/rear. De kaart leest dan
# exterior_side_left en exterior_back uit de sensorattributen.
display:
  image_mode: auto
  show_image_switcher: false

styles:
  image_height: 255px
